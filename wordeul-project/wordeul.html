<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wordeul — un jeu de mots inspiré de Wordle, en HTML, CSS et JavaScript natifs.">
    <title>Wordeul</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315803d'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style/wordeul.css">
    <link rel="stylesheet" href="style/buttons.css">
    <link rel="stylesheet" href="style/validation.css">
    <link rel="stylesheet" href="style/animation.css">
    <link rel="stylesheet" href="style/keyboard.css">
    <link rel="stylesheet" href="style/modal.css">
    <script src="js/dictionary.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/animation.js" defer></script>
    <script src="js/modal.js" defer></script>
    <script src="js/wordeul.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1 class="logo">Wordeul</h1>
    </header>

    <main class="page">
        <!-- Setup screen: rules and game configuration -->
        <section id="setup-view" class="card" aria-labelledby="rules-title">
            <h2 id="rules-title">But du jeu</h2>
            <p>Devinez un mot de 6 à 10 lettres. Tapez un mot et validez avec <kbd>Entrée</kbd> : s'il existe dans le dictionnaire, chaque lettre est colorée.</p>
            <ul class="legend">
                <li><span class="swatch" data-state="correct"></span>Bien placée</li>
                <li><span class="swatch" data-state="present"></span>Présente, mais mal placée</li>
                <li><span class="swatch" data-state="absent"></span>Absente du mot</li>
            </ul>

            <form id="setup-form" class="form" novalidate>
                <div class="field">
                    <label for="word">Mot à deviner</label>
                    <input type="password" id="word" name="word" autocomplete="off"
                           minlength="6" maxlength="10" pattern="[A-Za-z]{6,10}" required
                           aria-describedby="word-hint">
                    <small id="word-hint">6 à 10 lettres, sans accents. Il doit exister dans le dictionnaire.</small>
                </div>
                <div class="field">
                    <label for="attempts">Nombre de tentatives</label>
                    <input type="number" id="attempts" name="attempts" min="1" max="20" value="6" required>
                </div>
                <p id="form-error" class="form-error" role="alert"></p>
                <div class="actions">
                    <button type="button" id="random-btn" class="btn btn-secondary">Mot aléatoire</button>
                    <button type="submit" id="start-btn" class="btn btn-primary">Jouer</button>
                </div>
            </form>
        </section>

        <!-- Game screen: board and on-screen keyboard -->
        <section id="game-view" class="game" aria-label="Partie en cours" hidden>
            <div class="game-toolbar">
                <span id="game-info" class="game-info"></span>
                <button type="button" id="new-game-btn" class="btn btn-ghost">Nouvelle partie</button>
            </div>
            <div id="board" class="board" aria-label="Grille de jeu"></div>
            <div id="keyboard" class="keyboard" aria-label="Clavier"></div>
        </section>
    </main>

    <!-- End-of-game dialog -->
    <dialog id="result-dialog" class="dialog" aria-labelledby="result-title">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <div class="actions">
            <button type="button" id="close-btn" class="btn btn-secondary">Fermer</button>
            <button type="button" id="replay-btn" class="btn btn-primary">Rejouer</button>
        </div>
    </dialog>

    <!-- Short feedback messages (e.g. unknown word) -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
